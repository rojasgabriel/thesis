name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx --from ruff==0.15.4 ruff check .

      - name: Check formatting
        run: uvx --from ruff==0.15.4 ruff format --check .

      - name: Typecheck
        run: uvx --from ty==0.0.37 ty check
