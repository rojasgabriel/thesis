name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Imports use `ephys.src.*`; the repo root must be discoverable as package `ephys`
      # when its parent directory is on PYTHONPATH (matches local setups using ~/lib).
      PYTHONPATH: ${{ github.workspace }}/..

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff check .

      - name: Check formatting
        run: uvx ruff format --check .

      - name: Typecheck (ty)
        run: uvx --from ty==0.0.37 ty check

      - name: Test
        run: uv run python -m unittest discover -s tests
