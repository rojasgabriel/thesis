[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "thesis"
version = "0.1.0"
description = "Behavior and electrophysiology analyses for my Churchland Lab thesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datajoint>=0.14.8,<0.15",
    "diptest>=0.11.0",
    "fit-psychometric",
    "h5py",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "labdata>=0.1.15",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "pandas==2.3.3",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.0",
    "spks",
    "statsmodels>=0.14.6",
    "torch",
    "torchaudio",
    "pyqtgraph>=0.14,<0.15",
    "pyside6-essentials>=6.8,<7",
    "scienceplots>=2.2.2",
    "dpca",
    "matlab-dpca",
]

[project.scripts]
insert_audio_events = "thesis.ephys.preprocessing.insert_audio_events:main"
insert-stream-sync = "thesis.ephys.preprocessing.insert_streamsync:main"
populate-unit-counts = "thesis.ephys.preprocessing.populate_unit_counts:main"
psth = "thesis.ephys.tools.psth_app:main"
stimulus-response = "thesis.ephys.tools.stimulus_response_app:main"
survey-map = "thesis.ephys.tools.survey_map_app:main"
unit-stability = "thesis.ephys.tools.unit_stability_app:main"

[tool.uv.build-backend]
module-name = ["thesis", "labdata_plugin"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pillow>=12.3.0",
    "tornado>=6.5.7",
    "urllib3>=2.7.0",
    "pygments>=2.20.0",
    # DataJoint 0.14 still imports pkg_resources, removed in setuptools 81+.
    "setuptools>=79.0.1,<81",
]

[tool.uv.sources]
fit-psychometric = { git = "https://github.com/rojasgabriel/fit_psychometric", rev = "fa39c44fef00510cb7e9b8383ad492a56642f14c" }
spks = { git = "https://github.com/spkware/spks", rev = "451691a558650c80696a6871377f33986f3abb2f" }
dpca = { git = "https://github.com/machenslab/dPCA", subdirectory = "python", rev = "1def5b15854638811a25257dc0b68074ab5a1be0" }
matlab-dpca = { git = "https://github.com/rojasgabriel/matlab_dpca_in_python", rev = "8055ce10ff8d185bd7beb1d4563a4e2ecd3e92a8" }

[tool.ruff.lint]
# Check basic Python errors and import ordering.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# labdata registers plugins during import.
force-to-top = ["labdata", "labdata.schema"]

[tool.ty.src]
include = ["src", "notebooks"]
exclude = ["src/labdata_plugin"]

[tool.ty.environment]
# Type stubs for the runtime-loaded Chipmunk plugin.
extra-paths = ["typings"]
