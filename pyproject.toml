[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "thesis"
version = "0.1.0"
description = "Behavior and electrophysiology analyses for my Churchland Lab thesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datajoint>=0.14.8,<0.15",
    "diptest>=0.11.0",
    "fit-psychometric",
    "h5py",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "labdata>=0.1.15",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "pandas==2.3.3",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.0",
    "spks",
    "statsmodels>=0.14.6",
    "torch",
    "torchaudio",
    "pyqtgraph>=0.14,<0.15",
    "pyside6-essentials>=6.8,<7",
    "scienceplots>=2.2.2",
]

[project.scripts]
populate-unit-counts = "thesis.ephys.tools.populate_unit_counts:main"
psth = "thesis.ephys.tools.psth_app:main"
stimulus-responsiveness = "thesis.ephys.tools.stimulus_responsiveness_app:main"
survey-map = "thesis.ephys.tools.survey_map_app:main"
unit-stability = "thesis.ephys.tools.unit_stability_app:main"

[tool.uv.build-backend]
module-name = ["thesis", "labdata_plugin"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pillow>=12.3.0",
    "tornado>=6.5.7",
    "urllib3>=2.7.0",
    "pygments>=2.20.0",
    # DataJoint 0.14 still imports pkg_resources, removed in setuptools 81+.
    "setuptools>=79.0.1,<81",
]

[tool.uv.sources]
fit-psychometric = { git = "https://github.com/rojasgabriel/fit_psychometric", rev = "fa39c44fef00510cb7e9b8383ad492a56642f14c" }
spks = { git = "https://github.com/spkware/spks" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# labdata registers plugins during import.
force-to-top = ["labdata", "labdata.schema"]

[tool.ty.src]
include = ["src", "notebooks"]
exclude = ["src/labdata_plugin"]

[tool.ty.environment]
extra-paths = ["typings"]
